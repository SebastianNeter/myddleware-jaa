services:
  myddleware:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
     - 127.0.0.1:${myddleware_port:-30080}:80
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=myddleware
      - MYSQL_ROOT_PASSWORD=${mysql_root_password:-secret}
      - TRUSTED_PROXIES=127.0.0.1,172.16.0.0/12
      - TRUSTED_HOSTS=^(myddleware\.jaamericas\.org|localhost|127\.0\.0\.1)$
      - APP_ENV=prod
      - APP_DEBUG=0
      - APP_SECRET=${app_secret:-change_me_long_random}
      - DATABASE_URL=mysql://root:${mysql_root_password:-secret}@mysql:3306/myddleware?serverVersion=8.0
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.4.7
    ports:
      - ${mysql_bind_ip:-127.0.0.1}:3306:3306
    environment:
      - MYSQL_DATABASE=myddleware
      - MYSQL_ROOT_PASSWORD=${mysql_root_password:-secret}
      - MYSQL_USER=myddleware
      - MYSQL_PASSWORD=${mysql_password:-secret}
    command: 
      - --max_allowed_packet=524288000
      - --wait_timeout=900
      - --innodb_buffer_pool_size=1G
      - --innodb_flush_method=O_DIRECT
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_buffer_pool_instances=4
      - --innodb_read_io_threads=4
      - --innodb_write_io_threads=4
    volumes:
      - mysql_data:/var/lib/mysql:delegated
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mysql_data:
    external: true
    name: myddleware_mysql_data
